<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Recommender</title>
    <script src="controle-et-animation.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="animated-bg">
        <canvas id="space-canvas"></canvas>
        <div class="ab-overlay"></div>
        <div class="ab-orb" style="top:-20%;left:15%;width:600px;height:600px;background:rgba(180,54,20,0.28);filter:blur(120px);animation:ab-float1 14s ease-in-out infinite;"></div>
        <div class="ab-orb" style="bottom:-10%;right:15%;width:500px;height:500px;background:rgba(150,46,15,0.26);filter:blur(120px);animation:ab-float2 18s ease-in-out infinite;"></div>
        <div class="ab-orb" style="top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;background:rgba(220,84,15,0.16);filter:blur(100px);animation:ab-float3 22s ease-in-out infinite;"></div>
        <div class="ab-orb" style="top:10%;right:28%;width:220px;height:220px;background:rgba(255,120,25,0.12);filter:blur(80px);animation:ab-float1 10s ease-in-out infinite reverse;animation-delay:-4s;"></div>
        <div class="ab-orb" style="bottom:18%;left:22%;width:280px;height:280px;background:rgba(160,50,10,0.15);filter:blur(90px);animation:ab-float2 12s ease-in-out infinite reverse;animation-delay:-7s;"></div>
    </div>

    <!-- Floating Particles -->
    <div class="floating-particles" id="particles-container">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <div class="container" id="main-web-container">
        <div class="header">
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot status-api" id="statusDot"></span>
                <span id="statusText">API Mode</span>
            </div>
            <h1>Laptop Recommender</h1>
            <p>Compare laptops by budget, use case, and brand.</p>
        </div>
        
        <div class="main-content">
            <!-- Recommendation Form -->
            <div class="recommendation-form">
                <h2>Get Recommendations</h2>
                <form id="recommendForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="usage">Primary Usage:</label>
                            <select id="usage" name="usage">
                                <option value="general">General Use</option>
                                <option value="gaming">Gaming</option>
                                <option value="business">Business/Work</option>
                                <option value="student">Student</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="budget">Budget (USD):</label>
                            <input type="number" id="budget" name="budget" placeholder="e.g., 1000" min="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="brand">Preferred Brand (optional):</label>
                        <select id="brand" name="brand">
                            <option value="">Any Brand</option>
                            <option value="Acer">Acer</option>
                            <option value="Alienware">Alienware</option>
                            <option value="Apple">Apple</option>
                            <option value="ASUS">ASUS</option>
                            <option value="Dell">Dell</option>
                            <option value="Framework">Framework</option>
                            <option value="Google">Google</option>
                            <option value="HP">HP</option>
                            <option value="Lenovo">Lenovo</option>
                            <option value="LG">LG</option>
                            <option value="Microsoft">Microsoft</option>
                            <option value="MSI">MSI</option>
                            <option value="Razer">Razer</option>
                            <option value="Samsung">Samsung</option>
                            <option value="System76">System76</option>
                        </select>
                    </div>
                    <button type="submit" class="btn" id="find-button">Get Recommendations</button>
                </form>
            </div>
            
            <!-- Search Section -->
            <div class="search-section">
                <h2>Search Laptops</h2>
                <div class="search-box">
                    <input type="text" id="searchQuery" placeholder="Search for specific laptop models...">
                    <button onclick="searchLaptops()" id="search-action-button">Search</button>
                </div>
            </div>
            
            <!-- Loading -->
            <div id="loading" class="loading" style="display: none;">
                <p>Searching laptops...</p>
            </div>
            
            <!-- Results -->
            <div id="results" class="results" style="display: none;">
                <h2 id="resultsTitle">Recommendations</h2>
                <div id="laptopGrid" class="laptop-grid"></div>
            </div>
            
            <!-- Error -->
            <div id="error" class="error" style="display: none;"></div>
        </div>
    </div>
    
    <!-- Chatbot Toggle Button -->
    <button class="chatbot-toggle" onclick="toggleChatbot()" id="chatbotToggle" aria-label="Toggle laptop assistant chat">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
    </button>
    
    <!-- Chatbot Container -->
    <div class="chatbot-container" id="chatbotContainer">
        <div class="chatbot-header">
            <span>Laptop Assistant</span>
            <button class="chatbot-close" onclick="toggleChatbot()" id="close-chatbot">
                &times;
            </button>
        </div>
        <div class="chatbot-messages" id="chatbotMessages">
            <div class="message bot">
                Hi. Tell me your budget and what you need the laptop for.
            </div>
        </div>
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="chatbot-input">
            <input type="text" placeholder="Ask me about laptops..." id="chatbotInput" onkeypress="handleChatKeyPress(event)">
            <button onclick="sendMessage()" id="send-chat-payload">Send</button>
        </div>
    </div>
</body>
</html>
